# Пример для nginx (если хостинг не Apache)
server {
    listen 80;
    server_name aur0ra.ru www.aur0ra.ru;
    return 301 https://aur0ra.ru$request_uri;
}
server {
    listen 443 ssl http2;
    server_name aur0ra.ru;
    root /var/www/aur0ra/public;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location ~ /\. { deny all; }
    location ~* \.(bak|old|sql|log|ini|env|md)$ { deny all; }

    # PHP исполняется только для обработчика формы
    location = /send.php {
        limit_req zone=form burst=3 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/send.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location ~ \.php$ { deny all; }
}
# В секции http: limit_req_zone $binary_remote_addr zone=form:10m rate=6r/m;
